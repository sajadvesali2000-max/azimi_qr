}


body{

align-items:center;

background:
radial-gradient(circle at top,#b30000,#200000);

}


.card{

background:rgba(255,255,255,0.12);

0 20px 50px black;

linear-gradient(135deg,#ff1a1a,#650000);

0 0 25px #ff0000;

}



h1{

}



.subtitle{

}



.info{

margin-top:20px;

background:
rgba(0,0,0,.35);

}



.btn{

display:block;

margin-top:12px;

padding:15px;

border-radius:18px;

text-decoration:none;

color:white;

background:
linear-gradient(135deg,#e00000,#720000);

transition:.3s;

}


.btn:hover{

transform:scale(1.04);

}



.qrbox{

margin-top:25px;

background:white;

color:#111;

border-radius:25px;

padding:20px;

box-shadow:
0 10px 25px black;

}



.qrbox h3{

margin-top:0;

color:#700000;

}



.cardnumber{

font-size:18px;

font-weight:bold;

letter-spacing:1px;

}


.copy{

margin-top:10px;

border:none;

padding:12px 25px;

border-radius:15px;

background:#700000;

color:white;

cursor:pointer;

}


.footer{

margin-top:25px;

padding-top:15px;

border-top:1px solid #ffffff44;

font-size:14px;

color:#ddd;

line-height:2;


}

</head>

<script>


function copyCard(){

navigator.clipboard.writeText(
"6277601352163594"
).then(function(){
  showToast('شماره کارت کپی شد ✅');
}).catch(function(){
  alert('شماره کارت کپی شد ✅');
});

}

// Small toast implementation
function showToast(message){
  var t = document.createElement('div');
  t.textContent = message;
  t.style.position = 'fixed';
  t.style.bottom = '20px';
  t.style.left = '50%';
  t.style.transform = 'translateX(-50%)';
  t.style.background = '#222';
  t.style.color = '#fff';
  t.style.padding = '10px 18px';
  t.style.borderRadius = '8px';
  t.style.boxShadow = '0 6px 18px rgba(0,0,0,.4)';
  t.style.zIndex = 9999;
  document.body.appendChild(t);
  setTimeout(function(){ document.body.removeChild(t); }, 2500);
}

</script>
